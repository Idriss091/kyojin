[build-system]
requires = ["setuptools>=77", "wheel", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "exllamav3"
description = "Inference library for running local LLMs on modern consumer GPUs"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10.11"
license = "MIT"
authors = [{ name = "turboderp" }]
keywords = ["llm", "inference", "gpu", "quantization", "llama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6.0",
    "tokenizers>=0.21.1",
    "numpy>=2.1.0",
    "rich",
    "typing_extensions",
    "safetensors>=0.3.2",
    "ninja",
    "pillow",
    "pyyaml",
    "marisa_trie",
    "pydantic",
    "llguidance>=1.7.0",
    # Required by tools/{glm,mimo,qwen}/serve.py (already in
    # requirements.txt, was missing here so the Nix venv lacked them).
    "aiohttp",
    "jinja2",
    "triton-windows; platform_system == 'Windows'",
]

[project.optional-dependencies]
eval = [
    "transformers>=4.50.0",
    "datasets",
    "gguf>=0.14.0",
    "llama-cpp-python",
    "human_eval==1.0.3",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "seaborn>=0.13.2",
    "tabulate",
]
examples = [
    "blessed",
    "prompt_toolkit",
    "pyperclip",
    "requests",
    "pydantic",
]
# ROCm install from the lock (AMD multi-arch index, see install.md).
# This fork is ROCm-first: there are no CUDA extras, and torch resolves
# from AMD's index everywhere (including the default dependencies below),
# so no CUDA torch can ever enter the lock. Pinned to the verified set
# (doc/install.md); bump the whole set deliberately, then re-verify
# `nix build .#exllamav3`.
rocm = [
    "torch[device-gfx1151]==2.14.0+rocm10.1.0a20260822",
    "rocm[devel,device-gfx1151]==10.1.0a20260822",
    # Full ROCm stack pinned explicitly: uv only honors index sources
    # for direct requirements (transitive lookups fall back to PyPI,
    # where these builds cannot exist), so every AMD package is listed
    # even when also pulled transitively (same pins, by construction).
    "triton==3.8.0+git675c5987.rocm10.1.0a20260822",
    "rocm-sdk-core==10.1.0a20260822",
    "rocm-sdk-libraries==10.1.0a20260822",
    "rocm-sdk-devel==10.1.0a20260822",
    "rocm-sdk-device-gfx1151==10.1.0a20260822",
    "rocm-bootstrap==0.1.0",
    "amd-torch-device-gfx1151==2.14.0+rocm10.1.0a20260822",
    "amd-torch-device-gfx115x==2.14.0+rocm10.1.0a20260822",
]

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
include = ["exllamav3*"]

[tool.setuptools.package-data]
exllamav3 = [
    "py.typed",
    "util/hadamard_data/*",
    "conversion/standard_cal_data/*.utf8",
    "exllamav3_ext/**/*",
    "**/*.hip",
]

[tool.setuptools.dynamic]
version = { attr = "exllamav3.version.__version__" }

[tool.uv]
package = true
# AMD's nightly index versions everything pre-release (10.1.0a...); the
# rocm extra cannot resolve without this. Plain `uv lock` (no --upgrade)
# keeps existing pins, so this only affects newly-resolved requirements.
prerelease = "allow"

[tool.uv.sources]
# torch resolves from AMD's index everywhere (default deps included):
# this fork ships no CUDA torch in any configuration.
torch = [
    { index = "rocm" },
]
# Everything below only exists on AMD's index. The index is explicit,
# so each needs its own entry to be consulted.
triton = [
    { index = "rocm" },
]
rocm = [
    { index = "rocm" },
]
rocm-bootstrap = [
    { index = "rocm" },
]
rocm-sdk-core = [
    { index = "rocm" },
]
rocm-sdk-libraries = [
    { index = "rocm" },
]
rocm-sdk-devel = [
    { index = "rocm" },
]
rocm-sdk-device-gfx1151 = [
    { index = "rocm" },
]
amd-torch-device-gfx1151 = [
    { index = "rocm" },
]
amd-torch-device-gfx115x = [
    { index = "rocm" },
]


[[tool.uv.index]]
name = "rocm"
url = "https://rocm.nightlies.amd.com/whl-multi-arch/"
explicit = true
# NOTE: this index serves bare links with no hashes, so `uv lock` cannot
# record any. The cp312/linux artifacts used by Nix carry hand-backfilled
# `hash = "sha256:..."` entries in uv.lock (converted from verified pins
# via `nix hash convert --hash-algo sha256 --from nix32 --to base16`).
# If a future re-lock drops them, Nix evaluation fails loudly asking for
# a sha256 (`uv lock --check` does NOT verify hashes) — re-add them.
